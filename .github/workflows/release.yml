name: Release

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag or version name (e.g. v1.0.0)"
        required: false
        default: "manual-release"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Release tag is: ${TAG}"

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          tools: composer:v2
          coverage: none

      - name: Install production dependencies
        run: composer install --working-dir=app --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Package deployable application
        run: |
          chmod +x scripts/build-archive.sh
          ./scripts/build-archive.sh dist minilytics.tar.gz
          cp dist/minilytics.tar.gz "dist/minilytics-${{ steps.vars.outputs.tag }}.tar.gz"
          cd dist
          sha256sum "minilytics-${{ steps.vars.outputs.tag }}.tar.gz" > "minilytics-${{ steps.vars.outputs.tag }}.tar.gz.sha256"

      - name: Package landing page
        run: |
          chmod +x scripts/build-landing.sh
          ./scripts/build-landing.sh dist minilytics-landing.tar.gz

      - name: Generate Release Notes
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          REPO="${{ github.repository }}"
          CHECKSUM=$(awk '{print $1}' dist/minilytics.tar.gz.sha256)

          cat << EOF > release_notes.md
          ### Quick Install

          Extract into your website directory:

          \`\`\`bash
          curl -LO "https://github.com/${REPO}/releases/download/${TAG}/minilytics.tar.gz"
          tar -xzf minilytics.tar.gz && rm minilytics.tar.gz
          \`\`\`

          Ensure your web server can write to \`../minilytics-data/\` (or the folder set in \`MINILYTICS_DATA_DIR\`), then open \`/dashboard/\` to create the administrator account.

          ### Checksum

          \`\`\`text
          ${CHECKSUM}  minilytics.tar.gz
          \`\`\`
          EOF

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: minilytics-${{ steps.vars.outputs.tag }}
          path: |
            dist/minilytics.tar.gz
            dist/minilytics.tar.gz.sha256
            dist/minilytics-${{ steps.vars.outputs.tag }}.tar.gz
            dist/minilytics-${{ steps.vars.outputs.tag }}.tar.gz.sha256
            dist/minilytics-landing.tar.gz
            dist/minilytics-landing.tar.gz.sha256

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: ${{ steps.vars.outputs.tag }}
          tag_name: ${{ steps.vars.outputs.tag }}
          body_path: release_notes.md
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            dist/minilytics.tar.gz
            dist/minilytics.tar.gz.sha256
            dist/minilytics-${{ steps.vars.outputs.tag }}.tar.gz
            dist/minilytics-${{ steps.vars.outputs.tag }}.tar.gz.sha256
            dist/minilytics-landing.tar.gz
            dist/minilytics-landing.tar.gz.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
